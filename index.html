<!DOCTYPE html>
<html>
<head>
<title>K&A Logistics Services</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d') no-repeat center center/cover;
  color: white;
  padding: 20px;
}

.container {
  background: rgba(0,0,0,0.7);
  padding: 20px;
  border-radius: 10px;
  display: inline-block;
  width: 90%;
  max-width: 400px;
}

input, select {
  width: 90%;
  padding: 10px;
  margin: 10px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 12px 25px;
  background: gold;
  border: none;
  border-radius: 5px;
  font-weight: bold;
}

#priceDisplay {
  font-size: 18px;
  margin: 10px;
  color: gold;
}

.dashboard {
  margin-top: 30px;
  background: rgba(0,0,0,0.8);
  padding: 15px;
  border-radius: 10px;
}

.order {
  border-bottom: 1px solid #444;
  padding: 10px;
  text-align: left;
}

.status {
  color: lightgreen;
}
</style>
</head>

<body>

<div class="container">

<h2>K&A Logistics Services</h2>
<p>Fast Delivery at Your Doorstep</p>

<form id="orderForm" action="https://formspree.io/f/xojydkqb" method="POST">

<input type="text" name="name" placeholder="Your Name" required>
<input type="text" name="phone" placeholder="Phone Number" required>
<input type="text" name="pickup" placeholder="Pickup Location" required>
<input type="text" name="dropoff" placeholder="Drop-off Location" required>

<select name="zone" id="zone" onchange="updatePrice()" required>
<option value="">Select Delivery Zone</option>
<option value="30">Zone 1 - Queens ($30)</option>
<option value="45">Zone 2 - Brooklyn ($45)</option>
<option value="50">Zone 3 - Manhattan ($50)</option>
<option value="55">Zone 4 - Bronx ($55)</option>
<option value="60">Zone 5 - Staten Island ($60)</option>
</select>

<div id="priceDisplay">Price: $0</div>

<input type="hidden" name="price" id="priceInput">

<input type="text" name="details" placeholder="What do you need delivered?" required>

<button type="submit">Submit Request</button>

</form>

</div>

<!-- DASHBOARD -->
<div class="dashboard">
<h3>📦 Live Orders</h3>
<div id="ordersList"></div>
</div>

<script>

// PRICE CALCULATOR
function updatePrice() {
  let price = document.getElementById("zone").value;
  document.getElementById("priceDisplay").innerText = "Price: $" + price;
  document.getElementById("priceInput").value = price;
}

// LOCAL DASHBOARD STORAGE
document.getElementById("orderForm").addEventListener("submit", function() {

  let order = {
    name: document.querySelector('[name="name"]').value,
    pickup: document.querySelector('[name="pickup"]').value,
    dropoff: document.querySelector('[name="dropoff"]').value,
    price: document.getElementById("priceInput").value,
    status: "Pending"
  };

  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  orders.push(order);
  localStorage.setItem("orders", JSON.stringify(orders));

});

// DISPLAY ORDERS
function loadOrders() {
  let orders = JSON.parse(localStorage.getItem("orders")) || [];
  let list = document.getElementById("ordersList");
  list.innerHTML = "";

  orders.forEach((o, index) => {
    list.innerHTML += `
      <div class="order">
        <b>${o.name}</b><br>
        ${o.pickup} → ${o.dropoff}<br>
        💲${o.price}<br>
        <span class="status">${o.status}</span>
      </div>
    `;
  });
}

loadOrders();

</script>

</body>
</html>
