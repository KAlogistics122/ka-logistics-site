<!DOCTYPE html>
<html>
<head>
<title>K&A Logistics Services</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d') no-repeat center center/cover;
  color: white;
  padding: 50px;
}

.container {
  background: rgba(0,0,0,0.7);
  padding: 20px;
  border-radius: 10px;
  display: inline-block;
}

input, select {
  width: 80%;
  padding: 10px;
  margin: 10px;
  border-radius: 5px;
  border: none;
}

button {
  padding: 12px 25px;
  background: gold;
  border: none;
  border-radius: 5px;
  font-weight: bold;
}

h1 { font-size: 32px; }
</style>
</head>

<body>

<div class="container">
<h1>K&A Logistics Services</h1>
<h2>Fast Delivery at Your Doorstep</h2>

<form id="orderForm" action="https://formspree.io/f/xojydkqb" method="POST">

<input type="hidden" name="_subject" value="New K&A Logistics Order">

<input type="text" name="name" placeholder="Your Name" required>
<input type="text" name="phone" placeholder="Phone Number" required>
<input type="text" name="pickup" placeholder="Pickup Location" required>
<input type="text" name="dropoff" placeholder="Drop-off Location" required>

<select name="zone" id="zone" required onchange="setPrice()">
  <option value="">Select Delivery Zone</option>
  <option value="30">Zone 1 - $30 (Queens)</option>
  <option value="45">Zone 2 - $45 (Brooklyn)</option>
  <option value="50">Zone 3 - $50 (Manhattan)</option>
  <option value="55">Zone 4 - $55 (Bronx)</option>
  <option value="60">Zone 5 - $60 (Staten Island)</option>
</select>

<input type="text" id="price" name="price" placeholder="Price" readonly>

<input type="text" name="details" placeholder="What do you need delivered?" required>

<button type="submit">Submit Request</button>

</form>

<p>Call: 516-989-7953</p>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
// Auto pricing
function setPrice() {
  let zone = document.getElementById("zone").value;
  document.getElementById("price").value = "$" + zone;
}

// Supabase connection
const supabaseClient = supabase.createClient(
  "https://zkupeegvdnuohgygrdji.supabase.co",
  "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
);

// Save to database + allow Formspree email
document.getElementById("orderForm").addEventListener("submit", async function(e) {

  const formData = new FormData(this);

  await supabaseClient.from("orders").insert([
    {
      name: formData.get("name"),
      phone: formData.get("phone"),
      pickup: formData.get("pickup"),
      dropoff: formData.get("dropoff"),
      zone: formData.get("zone"),
      price: formData.get("price"),
      details: formData.get("details"),
      status: "Pending"
    }
  ]);

});
</script>

</body>
</html>
