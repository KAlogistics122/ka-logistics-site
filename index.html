<!DOCTYPE html>
<html>
<head>
  <title>K&A Logistics Services</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: url('https://images.unsplash.com/photo-1586528116311-addd3c8310d') no-repeat center center/cover;
      color: white;
      padding: 50px;
    }

    .container {
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
    }

    input, select {
      width: 80%;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 12px 25px;
      background: gold;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }

    h1 {
      font-size: 32px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>K&A Logistics Services</h1>
  <h2>Fast Delivery at Your Doorstep</h2>

  <form action="https://formspree.io/f/xojydkqb" method="POST">

    <input type="hidden" name="_subject" value="New K&A Logistics Order">

    <input type="text" name="name" placeholder="Your Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <input type="text" name="pickup" placeholder="Pickup Location" required>
    <input type="text" name="dropoff" placeholder="Drop-off Location" required>

    <select name="zone" required>
      <option value="">Select Delivery Zone</option>
      <option value="Zone 1 - $30 Queens">Zone 1 - $30 (Queens)</option>
      <option value="Zone 2 - $45 Brooklyn">Zone 2 - $45 (Brooklyn)</option>
      <option value="Zone 3 - $50 Manhattan">Zone 3 - $50 (Manhattan)</option>
      <option value="Zone 4 - $55 Bronx">Zone 4 - $55 (Bronx)</option>
      <option value="Zone 5 - $60 Staten Island">Zone 5 - $60 (Staten Island)</option>
    </select>

    <input type="text" name="details" placeholder="What do you need delivered?" required>

    <button type="submit">Submit Request</button>

  </form>

  <p>Call: 516-989-7953</p>

</div>

</body>
</html>
